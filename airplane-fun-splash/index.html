<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Jason and James's Airplane Fun Splash</title>
    <style>
        body { margin: 0; background: linear-gradient(#87ceeb, #bde0ff); font-family: Arial, sans-serif; }
        .hud { position: absolute; top: 10px; left: 10px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 18px; }
        .controls { position: absolute; top: 10px; right: 10px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 14px; text-align: right; }
        .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); color: #fff; flex-direction: column; gap: 12px; }
        .btn { padding: 10px 16px; background: #27ae60; color: #fff; border-radius: 8px; cursor: pointer; user-select: none; }
        .btn:hover { filter: brightness(1.05); }
        #progress { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 80%; height: 10px; background: rgba(255,255,255,0.3); border-radius: 6px; overflow: hidden; }
        #progress-inner { width: 0%; height: 100%; background: #2ecc71; transition: width 0.2s ease; }
        #runway-btn { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); width: min(720px, 90%); height: 44px; font-size: 18px; display: flex; align-items: center; justify-content: center; background: #2d3436; color: #ecf0f1; border-radius: 10px; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,0.25); letter-spacing: 1px; }
        #runway-btn:active { filter: brightness(1.15); }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    <div class="hud" id="hud">Score: 0 | Water: 5</div>
    <div class="controls">Move: ← → or A D<br>Drop Water: Space / Tap<br>Restart: R</div>
    <div class="overlay" id="overlay">
        <div style="font-size:32px">✈️ Airplane Fun Splash</div>
        <div id="result">Fly over the runway and press the big button to LAND. Press it again to TAKE OFF. Drop water to splash any runway fires!</div>
        <div class="btn" id="restart-btn">Play</div>
    </div>
    <div id="progress"><div id="progress-inner"></div></div>
    <div id="runway-btn">LAND (move to runway)</div>
    <script src="./game.js"></script>
</body>
</html>
